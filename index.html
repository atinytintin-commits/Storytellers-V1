<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oceania — Storytellers</title>
<style>
:root{
  --bg:#07131c; --panel:rgba(6,18,27,.88); --ink:#eefaff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
header{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;width:90%}
h1{margin:0;font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(20px,4vw,38px)}
header p{margin:8px 0;font-size:12px;letter-spacing:.08em;opacity:.65}
#animalName{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
#inputPanel{pointer-events:auto;position:absolute;bottom:0;left:0;width:100%;padding:20px 5vw 24px;background:linear-gradient(transparent,rgba(7,19,28,.75) 18%,var(--panel))}
textarea{display:block;width:min(900px,100%);height:105px;margin:auto;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:white;padding:15px 17px;font:16px/1.4 Arial;resize:none;outline:none}
textarea:focus{border-color:#79e9ff;box-shadow:0 0 24px rgba(80,210,255,.18)}
#info{width:min(900px,100%);margin:8px auto 0;display:flex;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.58}
@media(max-width:600px){textarea{height:92px;font-size:15px}#info{font-size:9px}header{top:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <header>
    <h1>Storytellers</h1>
    <p>At 200 characters, your stars lock into place and the constellation is revealed.</p>
    <div id="animalName"></div>
  </header>
  <div id="inputPanel">
    <textarea id="story" maxlength="2000" placeholder="Write your story here…"></textarea>
    <div id="info"><span id="legend">200 characters unlock the complete constellation</span><span id="count">0 characters</span></div>
  </div>
</div>
<script>

const animalLabel=document.getElementById('animalName'),count=document.getElementById('count');
let W,H,DPR,animal,points=[],stars=[],outlinePoints=[];

const palette=['#ff76b7','#62e8ff','#7d7aff','#b274ff','#ffffff','#49d6c7','#ffbf63','#ff6d88'];
const animals=[
 {name:'Sea Turtle',draw:turtle},{name:'Dolphin',draw:dolphin},{name:'Kangaroo',draw:kangaroo},

  g.moveTo(x+s*.58,y-s*.20); g.quadraticCurveTo(x+s*1.08,y-s*.03,x+s*1.18,y+s*.42);
  g.quadraticCurveTo(x+s*.94,y+s*.35,x+s*.66,y+s*.20); g.closePath();
  g.moveTo(x-s*.57,y+s*.40); g.quadraticCurveTo(x-s*.55,y+s*.87,x-s*.25,y+s*.98);
  g.quadraticCurveTo(x-s*.02,y+s*.94,x-s*.08,y+s*.57); g.closePath();

  g.moveTo(x-s*.18,y-s*.60); g.lineTo(x+s*.22,y-s*.70); g.lineTo(x+s*.55,y-s*.50); g.lineTo(x+s*.51,y-s*.19); g.lineTo(x+s*.22,y-s*.20);
  g.moveTo(x-s*.04,y+s*.02); g.lineTo(x+s*.22,y-s*.20); g.lineTo(x+s*.51,y-s*.19); g.lineTo(x+s*.58,y+s*.16); g.lineTo(x+s*.27,y+s*.43); g.lineTo(x-s*.08,y+s*.36); g.closePath();
  g.moveTo(x-s*.55,y-s*.43); g.lineTo(x-s*.64,y-s*.05); g.lineTo(x-s*.42,y+s*.31); g.lineTo(x-s*.08,y+s*.36); g.moveTo(x-s*.64,y-s*.05); g.lineTo(x-s*.04,y+s*.02);
}
function dolphin(g,x,y,s){

}
function kangaroo(g,x,y,s){

  g.lineTo(x-s*1.52,y-s*.69);
  g.quadraticCurveTo(x-s*1.42,y-s*.59,x-s*1.28,y-s*.59);
  g.quadraticCurveTo(x-s*1.15,y-s*.57,x-s*1.15,y-s*.43);
  g.quadraticCurveTo(x-s*1.18,y-s*.27,x-s*1.08,y-s*.15);
  // Front of chest and small forearms.
  g.quadraticCurveTo(x-s*.99,y+s*.05,x-s*.94,y+s*.25);
  g.quadraticCurveTo(x-s*.91,y+s*.39,x-s*.99,y+s*.52);
  g.quadraticCurveTo(x-s*1.03,y+s*.59,x-s*.94,y+s*.59);
  g.lineTo(x-s*.82,y+s*.42);
  g.quadraticCurveTo(x-s*.77,y+s*.33,x-s*.80,y+s*.20);
  g.quadraticCurveTo(x-s*.75,y+s*.29,x-s*.70,y+s*.39);
  g.lineTo(x-s*.60,y+s*.53);
  g.quadraticCurveTo(x-s*.55,y+s*.59,x-s*.48,y+s*.54);
  // Belly flows into the big bent hind leg.
  g.quadraticCurveTo(x-s*.22,y+s*.49,x+s*.03,y+s*.57);
  g.quadraticCurveTo(x+s*.20,y+s*.63,x+s*.30,y+s*.82);
  g.lineTo(x+s*.34,y+s*1.02);
  g.quadraticCurveTo(x+s*.36,y+s*1.10,x+s*.25,y+s*1.10);
  g.lineTo(x-s*.28,y+s*1.10);
  g.quadraticCurveTo(x-s*.40,y+s*1.09,x-s*.31,y+s*1.00);
  g.lineTo(x-s*.08,y+s*.83);
  g.quadraticCurveTo(x-s*.30,y+s*.74,x-s*.52,y+s*.67);
  g.quadraticCurveTo(x-s*.67,y+s*.63,x-s*.75,y+s*.76);
  g.lineTo(x-s*.91,y+s*.98);
  g.quadraticCurveTo(x-s*.98,y+s*1.06,x-s*1.05,y+s*1.01);
  g.quadraticCurveTo(x-s*.96,y+s*.81,x-s*.90,y+s*.61);
  g.quadraticCurveTo(x-s*.88,y+s*.45,x-s*.94,y+s*.32);
  g.quadraticCurveTo(x-s*1.00,y+s*.12,x-s*1.02,y-s*.04);
  g.quadraticCurveTo(x-s*1.05,y-s*.17,x-s*.92,y-s*.22);
  g.closePath();

  // Two long, tapered ears rising from the head.
  g.moveTo(x-s*1.18,y-s*.58);
  g.quadraticCurveTo(x-s*1.25,y-s*.91,x-s*1.40,y-s*1.32);
  g.quadraticCurveTo(x-s*1.18,y-s*1.24,x-s*1.05,y-s*.72);
  g.closePath();
  g.moveTo(x-s*1.08,y-s*.61);
  g.quadraticCurveTo(x-s*1.03,y-s*.98,x-s*.86,y-s*1.19);
  g.quadraticCurveTo(x-s*.89,y-s*.86,x-s*.96,y-s*.62);

  g.quadraticCurveTo(x-s*.53,y+s*.08,x-s*.61,y-s*.02);

function crocodile(g,x,y,s){
  g.beginPath();
  // Long tapering tail at left, low reptile body and broad snout at right.
  g.moveTo(x-s*1.85,y-s*.02);
  g.quadraticCurveTo(x-s*1.50,y-s*.13,x-s*1.13,y-s*.32);

}
function cassowary(g,x,y,s){

function bird(g,x,y,s){
  // Frigatebird silhouette: long, swept-back wings, a slim body,
  // a small head with hooked bill, and a deeply forked tail.
  // The diagonal pose follows the supplied reference image.
  g.beginPath();

  // Outer edge of the upper-left wing, sweeping into the shoulder.
  g.moveTo(x-s*.78,y-s*.98);
  g.quadraticCurveTo(x-s*.56,y-s*.88,x-s*.34,y-s*.66);
  g.lineTo(x-s*.08,y-s*.40);
  g.quadraticCurveTo(x-s*.02,y-s*.31,x-s*.02,y-s*.18);

  // Narrow body and head; short hooked bill points to the right.
  g.quadraticCurveTo(x+s*.00,y-s*.08,x+s*.12,y-s*.02);
  g.quadraticCurveTo(x+s*.23,y+s*.02,x+s*.32,y-s*.02);
  g.lineTo(x+s*.43,y-s*.07);
  g.lineTo(x+s*.34,y+s*.01);
  g.quadraticCurveTo(x+s*.27,y+s*.08,x+s*.27,y+s*.17);

  // Long lower-right wing, tapering to a sharp tip.
  g.quadraticCurveTo(x+s*.30,y+s*.31,x+s*.42,y+s*.43);
  g.lineTo(x+s*.91,y+s*.99);
  g.quadraticCurveTo(x+s*.86,y+s*.76,x+s*.73,y+s*.49);
  g.lineTo(x+s*.56,y+s*.20);
  g.quadraticCurveTo(x+s*.49,y+s*.10,x+s*.38,y+s*.09);

  // Tail feathers form a distinct fork behind the body.
  g.quadraticCurveTo(x+s*.22,y+s*.07,x+s*.13,y+s*.13);
  g.lineTo(x-s*.12,y+s*.30);
  g.lineTo(x-s*.16,y+s*.27);
  g.quadraticCurveTo(x-s*.12,y+s*.20,x-s*.02,y+s*.12);
  g.quadraticCurveTo(x-s*.12,y+s*.07,x-s*.14,y-s*.04);

  // Return along the inner edge of the upper wing.
  g.quadraticCurveTo(x-s*.18,y-s*.16,x-s*.22,y-s*.32);
  g.lineTo(x-s*.35,y-s*.57);
  g.quadraticCurveTo(x-s*.57,y-s*.82,x-s*.78,y-s*.98);
  g.closePath();
}
function shark(g,x,y,s){
  g.beginPath();
  // Streamlined shark facing right, with pointed snout and crescent tail.
  g.moveTo(x-s*1.52,y+s*.03);
  g.quadraticCurveTo(x-s*1.13,y-s*.24,x-s*.57,y-s*.32);

  g.moveTo(x-s*.12,y-s*.29); g.quadraticCurveTo(x+s*.04,y-s*.98,x+s*.30,y-s*.30);
  g.moveTo(x+s*.18,y+s*.20); g.lineTo(x+s*.49,y+s*.73); g.quadraticCurveTo(x+s*.56,y+s*.79,x+s*.56,y+s*.65);
  g.lineTo(x+s*.47,y+s*.24);
  // Tail crescent.
  g.moveTo(x-s*.85,y+s*.20); g.lineTo(x-s*1.24,y+s*.53); g.lineTo(x-s*1.18,y+s*.10);
  g.lineTo(x-s*1.40,y-s*.42); g.lineTo(x-s*.95,y-s*.14);
  // Gill marks and eye.
  for(let i=0;i<4;i++){let xx=x+s*.62+i*s*.09;g.moveTo(xx,y-s*.05);g.quadraticCurveTo(xx-s*.05,y+s*.08,xx,y+s*.20);}
  g.moveTo(x+s*1.14,y+s*.02); g.arc(x+s*1.14,y+s*.02,s*.025,0,Math.PI*2);
}

function resize(){
 DPR=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);

 // Sample points only along the animal's outline. The story will travel
 // through these points like a constellation rather than filling the silhouette.
 const isDolphin=animal.name==='Dolphin';
 const s=Math.min(W,H)*(isDolphin?.20:.30);
 const animalY=isDolphin?H*.37:H/2-35;
 const off=document.createElement('canvas');
 off.width=W;off.height=H;
 const g=off.getContext('2d');
 g.strokeStyle='#fff';
 g.lineWidth=3;
 animal.draw(g,W/2,animalY,s);
 g.stroke();

 const d=g.getImageData(0,0,W,H).data;
 points=[];
 for(let y=60;y<H-135;y+=3){
   for(let x=15;x<W-15;x+=3){
     if(d[(y*W+x)*4+3]>0) points.push({x,y});
   }
 }

 // Ordered points around the centre let us draw clean connecting paths.
 const cx=W/2,cy=H/2-35;
 outlinePoints=points.map(p=>({...p,a:Math.atan2(p.y-cy,p.x-cx),dist:Math.hypot(p.x-cx,p.y-cy)}))
   .sort((a,b)=>a.a-b.a);

 stars=Array.from({length:90},(_,i)=>({x:(i*197)%W,y:(i*131)%(H-130),r:.3+(i%4)*.28}));
 render();
}

function hash(s){let h=2166136261;for(let ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function seeded(n){n=(n+0x6D2B79F5)|0;let t=Math.imul(n^(n>>>15),1|n);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296}
function alpha(ch){let n=ch.toUpperCase().charCodeAt(0);return n>=65&&n<=90?n-64:0}
function drawBg(){
 let g=ctx.createRadialGradient(W/2,H/2-40,10,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#123243');g.addColorStop(.55,'#081923');g.addColorStop(1,'#03070b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.16)';stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});
}
function render(){
 drawBg();

 const text=story.value;
 const charCount=text.length;
 count.textContent=charCount+' characters';

 if(!outlinePoints.length)return;

 const cx=W/2, cy=H/2-35;

 if(!text){
   ctx.globalAlpha=.08;
   ctx.strokeStyle='#9fefff';
   ctx.lineWidth=1;
   const isDolphin=animal.name==='Dolphin';
   animal.draw(ctx,cx,isDolphin?H*.37:cy,Math.min(W,H)*(isDolphin?.20:.30));
   ctx.stroke();
   ctx.globalAlpha=1;
   return;
 }

 const letters=[...text].filter(ch=>/[a-z]/i.test(ch));
 const dotCount=Math.min(
   Math.max(letters.length*2,24),
   Math.min(outlinePoints.length,850)
 );

 // 200 characters is the transformation threshold.
 const locked=charCount>=200;
 const dots=[];

 for(let i=0;i<dotCount;i++){
   const ch=letters[i%Math.max(1,letters.length)]||'A';
   const v=alpha(ch);

   // Spread the main stars around the full animal outline.
   const baseIndex=Math.floor(
     i*outlinePoints.length/Math.max(1,dotCount)
   );

   const p=outlinePoints[baseIndex%outlinePoints.length];
   const seed=hash(text+'|'+i+'|'+ch);
   const angle=seeded(seed)*Math.PI*2;

   // Before 200 characters the stars hover close to the animal.
   // At 200 they lock exactly onto the clean outline.
   const distance=locked ? 0 : 4+seeded(seed+91)*11;

   const x=p.x+Math.cos(angle)*distance;
   const y=p.y+Math.sin(angle)*distance;
   const col=palette[(v-1+palette.length)%palette.length];

   dots.push({x,y,col,v,seed});
 }

 // MAIN CONSTELLATION STARS
 dots.forEach(d=>{
   if(locked){
     // Soft glow after the constellation is established.
     ctx.beginPath();
     ctx.arc(d.x,d.y,5.5,0,Math.PI*2);
     ctx.fillStyle=d.col;
     ctx.globalAlpha=.16;
     ctx.fill();
   }

   ctx.beginPath();
   ctx.arc(d.x,d.y,2.7,0,Math.PI*2);
   ctx.fillStyle=d.col;
   ctx.globalAlpha=locked ? .98 : .72;
   ctx.fill();

   if(locked){
     ctx.beginPath();
     ctx.arc(d.x,d.y,.7,0,Math.PI*2);
     ctx.fillStyle='#ffffff';
     ctx.globalAlpha=.58;
     ctx.fill();
   }
 });

 // At 200 characters the complete constellation outline appears at once.
 if(locked && dots.length>2){
   for(let i=0;i<dots.length-1;i++){
     const a=dots[i],b=dots[i+1];
     ctx.beginPath();
     ctx.moveTo(a.x,a.y);
     ctx.lineTo(b.x,b.y);
     ctx.strokeStyle=a.col;
     ctx.globalAlpha=.40;
     ctx.lineWidth=1;
     ctx.stroke();
   }

   // Close the full outline.
   ctx.beginPath();
   ctx.moveTo(dots[dots.length-1].x,dots[dots.length-1].y);
   ctx.lineTo(dots[0].x,dots[0].y);
   ctx.strokeStyle=dots[dots.length-1].col;
   ctx.globalAlpha=.40;
   ctx.lineWidth=1;
   ctx.stroke();

   // AFTER 200 CHARACTERS:
   // Add smaller decorative dots in controlled bands around the animal.
   // These are inspired by the visual density of Australian Indigenous
   // dot painting, without attempting to reproduce any specific sacred
   // motif or community design.
   const extraChars=Math.max(0,charCount-200);
   const decorationCount=Math.min(700,45+extraChars*3);

   for(let i=0;i<decorationCount;i++){
     const seed=hash(text+'|decorative|'+i);
     const base=outlinePoints[
       Math.floor(seeded(seed)*outlinePoints.length)
     ];

     // Controlled halo: mostly 10–55px from the silhouette.
     // Some dots sit closer together to create clustered dot fields.
     const angle=seeded(seed+17)*Math.PI*2;
     const ring=10+seeded(seed+31)*45;

     // Gentle directional drift prevents a perfectly mathematical halo.
     const jitterX=(seeded(seed+53)-.5)*8;
     const jitterY=(seeded(seed+71)-.5)*8;

     const x=base.x+Math.cos(angle)*ring+jitterX;
     const y=base.y+Math.sin(angle)*ring+jitterY;

     // Keep decoration away from the text panel.
     if(y>H-145)continue;

     const letter=letters[i%Math.max(1,letters.length)]||'A';
     const v=alpha(letter);
     const col=palette[(v+i)%palette.length];

     // Smaller dots than the main constellation stars.
     const r=1.05+seeded(seed+89)*1.35;

     ctx.beginPath();
     ctx.arc(x,y,r,0,Math.PI*2);
     ctx.fillStyle=col;
     ctx.globalAlpha=.48+seeded(seed+107)*.42;
     ctx.fill();
   }
 }

 ctx.globalAlpha=1;
}

function outline(){}
story.addEventListener('input',render);
resize();addEventListener('resize',resize);
</script>
